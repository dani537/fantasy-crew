name: Biwenger Agent Workflow

# Configuración de disparadores del script (Estilo Hybo / 019. Hybo)
on:
  # 1. Manual: Permite ejecutar el script con un botón desde GitHub Actions
  workflow_dispatch:
    inputs:
      mode:
        description: 'Modo de ejecución (action, auction, briefing)'
        required: true
        default: 'action'
        type: choice
        options:
          - action
          - auction
          - briefing
      dry_run:
        description: 'Modo simulación (sin cambios en la API)'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

  # 2. Externo: Permite disparar el bot desde Cron-job.org u otro servicio externo vía API
  repository_dispatch:
    types: [external_cron]

  # 3. Opcional - Cron interno de GitHub (Desactivado a favor de Cron-job.org para cero lag)
  # schedule:
  #   - cron: '45 4 * * *'  # 6:45 CEST (auction mode)
  #   - cron: '10 5 * * *'  # 7:10 CEST (briefing mode)

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias CI
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Seleccionar modo de ejecución
        id: select
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode }}" >> $GITHUB_OUTPUT
            echo "dry_run=${{ inputs.dry_run }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            MODE="${{ github.event.client_payload.mode }}"
            DRY="${{ github.event.client_payload.dry_run }}"
            echo "mode=${MODE:-action}" >> $GITHUB_OUTPUT
            echo "dry_run=${DRY:-false}" >> $GITHUB_OUTPUT
          else
            echo "mode=action" >> $GITHUB_OUTPUT
            echo "dry_run=false" >> $GITHUB_OUTPUT
          fi

      - name: Ejecutar Biwenger Agent (${{ steps.select.outputs.mode }})
        env:
          # Secrets (Configurar en GitHub > Settings > Secrets and variables > Actions > Secrets)
          BIWENGER_USERNAME: ${{ secrets.BIWENGER_USERNAME }}
          BIWENGER_PASSWORD: ${{ secrets.BIWENGER_PASSWORD }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}

          # Variables (Configurar en GitHub > Settings > Secrets and variables > Actions > Variables)
          GMAIL_ADRESS: ${{ vars.GMAIL_ADRESS }}
          LANGUAGE: ${{ vars.LANGUAGE }}
          SCORE_TYPE: ${{ vars.SCORE_TYPE }}
          DRY_RUN: ${{ steps.select.outputs.dry_run }}
        run: python main.py --mode ${{ steps.select.outputs.mode }}
