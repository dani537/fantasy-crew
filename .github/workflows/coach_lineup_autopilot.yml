name: "⚡ Entrenador Inmediato: Once Óptimo & Mercado (<30s)"

on:
  workflow_dispatch:
    inputs:
      autopilot_mode:
        description: 'Modo Autopilot (FULL_AUTO, SEMI_AUTO, DRY_RUN)'
        type: choice
        options:
          - 'FULL_AUTO'
          - 'SEMI_AUTO'
          - 'DRY_RUN'
        required: false
        default: 'FULL_AUTO'
      phase:
        description: 'Fase táctica a ejecutar'
        type: choice
        options:
          - 'MORNING_FULL'
          - 'PRE_CLAUSE_LOCK'
          - 'PRE_KICKOFF_SOLVENCY'
          - 'FINAL_LINEUP_GUARD'
          - 'POST_ROUND_SETTLEMENT'
        required: false
        default: 'MORNING_FULL'

concurrency:
  group: fantasy-champion-biwenger
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  coach-autopilot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: "."
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_SERVICE_ACCOUNT_FILE: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_FILE }}
      GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID || vars.GOOGLE_SHEET_ID || '1V3lDapPrpGgLGVl-rvNi3Ishy70dAo22UEn24toa4kk' }}
      GOOGLE_SHEET_ID_MARKET: ${{ secrets.GOOGLE_SHEET_ID_MARKET || secrets.GOOGLE_SHEET_ID || '1V3lDapPrpGgLGVl-rvNi3Ishy70dAo22UEn24toa4kk' }}
      BIWENGER_TOKEN: ${{ secrets.BIWENGER_TOKEN }}
      BIWENGER_USERNAME: ${{ secrets.BIWENGER_USERNAME }}
      BIWENGER_PASSWORD: ${{ secrets.BIWENGER_PASSWORD }}
      BIWENGER_LEAGUE_ID: ${{ secrets.BIWENGER_LEAGUE_ID || vars.BIWENGER_LEAGUE_ID }}
      BIWENGER_USER_ID: ${{ secrets.BIWENGER_USER_ID || vars.BIWENGER_USER_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      LLM_PROVIDER: ${{ vars.LLM_PROVIDER || secrets.LLM_PROVIDER }}
      LLM_MODEL: ${{ vars.LLM_MODEL || secrets.LLM_MODEL }}
      LLM_BASE_URL: ${{ vars.LLM_BASE_URL || secrets.LLM_BASE_URL }}
      GEMINI_MODEL_DAILY: ${{ vars.GEMINI_MODEL_DAILY || 'gemini-4-hydrogen' }}
      ACTIVE_ARCHETYPE: ${{ vars.ACTIVE_ARCHETYPE || 'LIQUIDITY_VULTURE_PRO' }}
      SCORE_TYPE: ${{ vars.SCORE_TYPE || secrets.SCORE_TYPE || '5' }}
      LANGUAGE: ${{ vars.LANGUAGE || 'es' }}
      GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS || secrets.GMAIL_ADRESS || vars.GMAIL_ADDRESS || vars.GMAIL_ADRESS }}
      GMAIL_PASSWORD: ${{ secrets.GMAIL_PASSWORD }}
      NOTIFY_EMAIL_TO: ${{ secrets.NOTIFY_EMAIL_TO || vars.NOTIFY_EMAIL_TO || vars.GMAIL_ADDRESS || secrets.GMAIL_ADDRESS || vars.GMAIL_ADRESS || secrets.GMAIL_ADRESS }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_ALLOWED_CHAT_ID: ${{ secrets.TELEGRAM_ALLOWED_CHAT_ID || vars.TELEGRAM_ALLOWED_CHAT_ID }}
      AUTOPILOT_MODE: ${{ github.event.inputs.autopilot_mode || vars.AUTOPILOT_MODE || 'FULL_AUTO' }}

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 📦 Install Dependencies
        run: pip install -r requirements.txt

      - name: ☁️ Hydrate Memory & Warehouse Snapshot from Google Sheets
        run: |
          if [ -n "$GOOGLE_SHEET_ID" ] && [ -n "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then
            python -u -m src.tools.data_extraction.sync_local --no-api || true
          fi

      - name: ⚽ Execute Coach / Autopilot & Sync Lineup (<30s)
        run: python -u -m src.tools.strategy_engine.autopilot --phase ${{ github.event.inputs.phase || 'MORNING_FULL' }} --mode $AUTOPILOT_MODE --notify
