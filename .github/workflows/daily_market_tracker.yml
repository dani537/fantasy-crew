name: Daily Biwenger Market Tracker

on:
  schedule:
    # 05:23 UTC = 07:23 CEST (Horario de verano en España) - Minuto no congestionado
    - cron: '23 5 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [run-market-tracker, daily-market-capture]

permissions:
  contents: write

jobs:
  daily-market-capture:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🚀 Run Daily Market Capture & Google Sheets Sync
        env:
          PYTHONUNBUFFERED: "1"
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID_MARKET: ${{ secrets.GOOGLE_SHEET_ID_MARKET }}
          BIWENGER_TOKEN: ${{ secrets.BIWENGER_TOKEN }}
          BIWENGER_USERNAME: ${{ secrets.BIWENGER_USERNAME }}
          BIWENGER_PASSWORD: ${{ secrets.BIWENGER_PASSWORD }}
          BIWENGER_LEAGUE_ID: ${{ secrets.BIWENGER_LEAGUE_ID }}
          BIWENGER_USER_ID: ${{ secrets.BIWENGER_USER_ID }}
        run: |
          # 1. Update general league context if credentials are provided
          python -u -m src.tools.data_extraction.runner || true

          # 2. Run master 40-dimensional market tracker & sync to Google Sheets
          python -u src/tools/data_extraction/daily_market_tracker.py

      - name: 💾 Commit and Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "ℹ️ No changes detected in data/ directory."
          else
            git commit -m "chore(data): auto-update daily market snapshot [$(date +'%Y-%m-%d')]"
            git push
          fi
